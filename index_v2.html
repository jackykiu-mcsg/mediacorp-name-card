<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jacky Kiu - Name Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background: #2e2e2e;
      font-family: 'Segoe UI', sans-serif;
    }

    .card-container {
      max-width: 420px;
      margin: 50px auto;
      background: #f7f7f2;
      padding: 30px 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .brand-logos {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .brand-logos img {
      height: 28px;
    }

    .main-logo {
      display: block;
      margin: 0 auto 15px;
      height: 40px;
    }

    .name {
      font-weight: 700;
      font-size: 1.5rem;
      text-align: center;
    }

    .position,
    .team,
    .chinese-position {
      font-style: italic;
      text-align: center;
      font-size: 0.95rem;
    }

    .chinese-position {
      font-style: normal;
      margin-bottom: 20px;
    }

    .action-buttons {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .action-buttons button {
      width: 45%;
      background: #f5f5f5;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 10px;
      font-size: 1rem;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 1.4rem;
      margin-top: 25px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: #999;
    }

    .corner-triangle {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 120px solid #ccc;
      border-left: 120px solid transparent;
    }

    .corner-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-bottom: 120px solid #ccc;
      border-right: 120px solid transparent;
    }
  </style>
</head>

<body>
  <div class="card-container position-relative">
    <div class="corner-triangle"></div>
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/01/Mediacorp_2015_Logo.svg" class="main-logo" alt="Mediacorp Logo">

    <div class="brand-logos">
      <img src="https://upload.wikimedia.org/wikipedia/en/thumb/f/fb/8world_logo.png/200px-8world_logo.png" alt="8world">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/ed/Vibes_logo.png" alt="Vibes" style="height:22px;">
      <img src="https://upload.wikimedia.org/wikipedia/en/thumb/6/60/Capital958_logo.png/200px-Capital958_logo.png" alt="Capital958">
    </div>

    <div class="text-center">
      <div class="name">Jacky Kiu 邱雲翔</div>
      <div class="position">Senior Web Designer</div>
      <div class="chinese-position">資深網頁設計師</div>
      <div class="team">Chinese Digital Content<br>Audience Growth Team</div>
      <div class="chinese-position">中文數位內容與受眾擴展策略組</div>
    </div>

    <div class="action-buttons">
      <button><i class="fas fa-phone"></i> Call</button>
      <button><i class="fas fa-envelope"></i> Email</button>
      <button><i class="fas fa-id-card"></i> Contact Info</button>
      <button><i class="fas fa-qrcode"></i> QR Code</button>
    </div>

    <div class="socials mt-4">
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-youtube"></i></a>
      <a href="#"><i class="fab fa-x-twitter"></i></a>
      <a href="#"><i class="fab fa-telegram"></i></a>
      <a href="#"><i class="fab fa-linkedin-in"></i></a>
    </div>

    <div class="footer">© 広末堂</div>
    <div class="corner-bottom"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
